[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-approval-gate"
version = "0.1.0"
description = "Classify shell command risk for local coding agents before execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-approval-gate maintainers" }]
keywords = ["codex", "coding-agent", "cli", "python", "automation", "security", "approval", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
agent-approval-gate = "agent_approval_gate.cli:main"

[project.urls]
Homepage = "https://github.com/PlutoYQ-NTU/agent-approval-gate"
Issues = "https://github.com/PlutoYQ-NTU/agent-approval-gate/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]